name: Create signing key (run once)

# Creates an Android release keystore + random passwords and gives them to you as a private,
# 1-day download. Copy the four values into Settings > Secrets and variables > Actions > Secrets,
# then DELETE the artifact. Keep a backup of the values: if you lose them you can never update the app on Play.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  keystore:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - name: Generate keystore
        run: |
          set -euo pipefail
          STORE_PASS="$(openssl rand -hex 16)"
          KEY_PASS="$STORE_PASS"
          ALIAS="ainjomi"
          keytool -genkeypair -v -keystore release.keystore -alias "$ALIAS" -keyalg RSA -keysize 4096 -validity 10000 \
            -storepass "$STORE_PASS" -keypass "$KEY_PASS" -dname "CN=Ain Jomi, O=Ain Jomi, C=BD" >/dev/null
          {
            echo "KEYSTORE_PASSWORD=$STORE_PASS"
            echo "KEY_ALIAS=$ALIAS"
            echo "KEY_PASSWORD=$KEY_PASS"
            echo "KEYSTORE_BASE64 (copy the whole next line):"
            base64 -w0 release.keystore
            echo
          } > keystore-secrets.txt
          echo "::add-mask::$STORE_PASS"
      - uses: actions/upload-artifact@v4
        with:
          name: keystore-secrets
          path: keystore-secrets.txt
          retention-days: 1
